name: Bug report
description: Something in the guide is wrong or does not match how a repository actually works
title: "fix: "
labels: ["bug"]
assignees:
  - zaccesss
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: A short sentence explaining what this issue covers.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why does this need fixing? What problem does it cause?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything extra - links, related repositories, edge cases to watch for.
    validations:
      required: false
